<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PlayMyJam - Login</title>
<!-- CRITICAL: Material Symbols Link -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f20da6",
              "background-light": "#f8f5f7",
              "background-dark": "#22101c",
              "surface-dark": "#392833",
              "surface-muted": "#ba9cb0"
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            backgroundImage: {
                'gradient-glow': 'linear-gradient(135deg, #f20da6 0%, #b00b7a 100%)',
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<!-- Main Container -->
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden bg-background-light dark:bg-background-dark text-slate-900 dark:text-white transition-colors duration-200">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between z-10">
<!-- Back Button -->
<button class="flex size-12 shrink-0 items-center justify-center rounded-full text-slate-900 dark:text-white hover:bg-slate-200 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Title -->
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">PlayMyJam</h2>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 flex flex-col w-full max-w-[480px] mx-auto">
<!-- Hero Section -->
<div class="@container w-full">
<div class="@[480px]:px-4 @[480px]:py-3 w-full">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden @[480px]:rounded-xl min-h-[240px] relative group" data-alt="Crowd at a concert with purple and pink stage lighting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB9SKr4kOTX5szyUb_TEm8q4wNMnFhCTLq5cmEAqLrW232N7w8SXlIVxPISn0ZZWucq_5A5ASYn_EsYDkrygW5S9ylyqpjQArQC8p2LKOMvlfdMcmO-KE4If7XmdpP--csV2Af4jv0Ill4vKEOjyg5uVS3i0o8DHv7JweVYp7wBqN6czAhFqvgMNTEVQci5jj0EdmcFQMvnTZvBaSK4EJF4TIK6aoITLpF5nAaceha_wEqXhg_11GJeHEOr0dpfqDOOyasMV9yI5-E");'>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-background-light via-transparent to-transparent dark:from-background-dark dark:via-transparent dark:to-transparent opacity-100"></div>
<div class="absolute inset-0 bg-primary/20 mix-blend-overlay"></div>
</div>
</div>
</div>
<!-- Header Text -->
<div class="px-6 pt-4 pb-2 text-center">
<h1 class="tracking-tight text-[32px] font-extrabold leading-tight mb-2">
                    Let's get the <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400">party started</span>
</h1>
<p class="text-slate-500 dark:text-surface-muted text-base font-normal leading-relaxed">
                    Queue up your favorite tracks and vote for what plays next at your local venue.
                </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5 px-6 py-6 w-full" onsubmit="event.preventDefault()">
<!-- Email Field -->
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold ml-1">Email</span>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-surface-muted group-focus-within:text-primary transition-colors">mail</span>
<input class="form-input flex w-full resize-none overflow-hidden rounded-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-white dark:bg-surface-dark h-14 placeholder:text-slate-400 dark:placeholder:text-surface-muted pl-12 pr-4 text-base font-normal leading-normal shadow-sm ring-1 ring-slate-200 dark:ring-0 transition-all" placeholder="hello@example.com" type="email"/>
</div>
</label>
<!-- Password Field -->
<label class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<span class="text-sm font-semibold">Password</span>
<a class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-surface-muted group-focus-within:text-primary transition-colors">lock</span>
<input class="form-input flex w-full resize-none overflow-hidden rounded-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-white dark:bg-surface-dark h-14 placeholder:text-slate-400 dark:placeholder:text-surface-muted pl-12 pr-12 text-base font-normal leading-normal shadow-sm ring-1 ring-slate-200 dark:ring-0 transition-all" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</label>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 mt-2">
<button class="h-14 w-full rounded-xl bg-gradient-glow text-white font-bold text-lg shadow-[0_4px_20px_rgba(242,13,166,0.3)] hover:shadow-[0_4px_25px_rgba(242,13,166,0.5)] hover:scale-[1.01] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
                        Log In
                        <span class="material-symbols-outlined text-[20px] font-bold">login</span>
</button>
<button class="h-14 w-full rounded-xl bg-transparent border-2 border-slate-200 dark:border-surface-dark text-slate-900 dark:text-white font-bold text-lg hover:bg-slate-50 dark:hover:bg-surface-dark hover:border-primary/30 active:scale-[0.98] transition-all duration-200">
                        Sign Up
                    </button>
</div>
</form>
<!-- Social Login Divider -->
<div class="px-6 pb-6">
<div class="relative py-2 flex items-center justify-center mb-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-white/10"></div>
</div>
<div class="relative bg-background-light dark:bg-background-dark px-4 text-xs uppercase text-slate-500 dark:text-surface-muted font-bold tracking-wider">
                        Or login with
                    </div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="h-14 flex items-center justify-center gap-3 rounded-xl bg-white dark:bg-surface-dark text-slate-900 dark:text-white font-semibold shadow-sm hover:bg-slate-50 dark:hover:bg-[#4a3543] transition-colors ring-1 ring-slate-200 dark:ring-0">
<!-- Google Icon SVG (inline for stability) -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
<button class="h-14 flex items-center justify-center gap-3 rounded-xl bg-white dark:bg-surface-dark text-slate-900 dark:text-white font-semibold shadow-sm hover:bg-slate-50 dark:hover:bg-[#4a3543] transition-colors ring-1 ring-slate-200 dark:ring-0">
<span class="material-symbols-outlined text-[24px]">ios</span>
<span>Apple</span>
</button>
</div>
</div>
<!-- Spacer -->
<div class="h-6"></div>
</div>
</div>
</body></html>
